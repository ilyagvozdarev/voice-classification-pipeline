[tool.ruff]
# Целевая версия Python (у нас 3.11 во всех Dockerfile).
target-version = "py311"
line-length = 100
# Нужно, чтобы заработали правила FAST (flake8-fastapi) — они пока в preview.
preview = true

[tool.ruff.lint]
# Наборы правил, которые проверяем:
#   E, W  — стиль PEP 8 (pycodestyle)
#   F     — логические ошибки (pyflakes): неиспользуемые импорты/переменные и т.п.
#   I     — сортировка импортов (isort)
#   B     — вероятные баги (flake8-bugbear)
#   BLE   — «слепой» except Exception (flake8-blind-except) — тот самый BLE001
#   UP    — устаревшие конструкции (pyupgrade)
#   C4    — упрощения для comprehensions
#   SIM   — упрощение громоздких if/return/with (flake8-simplify)
#   RET   — чистка логики return (flake8-return)
#   PIE   — мелкие «ненужности» в коде (flake8-pie)
#   ASYNC — ловушки в async-коде (flake8-async) — актуально для master
#   LOG,G — корректное использование logging (flake8-logging / -format)
#   RUF   — полезные проверки от авторов Ruff
#   FAST  — правила под FastAPI (flake8-fastapi)
#   ANN   — обязательные аннотации типов (flake8-annotations) — ШУМНО
#   D     — обязательные docstring (pydocstyle) — ШУМНО
#   S     — безопасность (flake8-bandit) — полезно, бывают ложные срабатывания
#   DOC   — соответствие docstring сигнатуре (pydoclint, preview): все
#           параметры/возврат/исключения задокументированы
select = [
    "E", "W", "F", "I", "B", "BLE", "UP", "C4",
    "SIM", "RET", "PIE", "ASYNC", "LOG", "G", "RUF",
    "FAST", "ANN", "D", "S", "DOC",
]

# Точечные послабления по всему проекту (при желании убери):
ignore = [
    "E501",   # длину строки уже контролирует line-length + форматтер
    # RUF001-003 ругаются на кириллицу как на «двойники» латиницы —
    # ложные срабатывания для русскоязычных комментариев. Отключаем.
    "RUF001",
    "RUF002",
    "RUF003",
    # ANN101/ANN102 — аннотировать self/cls не нужно (правило устарело в ruff).
    "ANN101",
    "ANN102",
    # S104 — привязка к 0.0.0.0. В контейнере это ОБЯЗАТЕЛЬНО (иначе сервис
    # не виден снаружи), так что здесь это не уязвимость, а норма.
    "S104",
    # Смягчаем docstring-политику: оставляем требование документировать
    # классы/методы/функции (D101/D102/D103), но НЕ требуем docstring у
    # модулей (D100), пакетов/__init__ (D104) и конструкторов (D107).
    "D100",
    "D104",
    "D107",
]

[tool.ruff.lint.pydocstyle]
# NumPy-стиль docstring (как в pandas/NumPy): секции Parameters/Returns/…
# с подчёркиваниями ----. Конвенция также разруливает конфликты D-правил.
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# В __init__.py нормально иметь «неиспользуемые» импорты (реэкспорт).
"__init__.py" = ["F401"]
# B008 (вызов в дефолте аргумента) — ложная тревога для FastAPI:
# File(...)/Depends(...)/Query(...) так и пишутся. Глушим ТОЛЬКО в файлах
# с эндпоинтами, а в остальном коде правило остаётся включённым и ловит
# реальные баги вроде `def f(ts=time.time())`.
"**/main.py" = ["B008"]

[tool.ruff.format]
# Форматтер в стиле black (одинарные кавычки -> двойные и т.п.).
quote-style = "double"
